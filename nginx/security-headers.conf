# Headers de seguridad (Rest Client — sin WASM, sin service worker).
#
# Se incluye en el `server {}` y en cada `location` que declare sus propios
# `add_header` (nginx NO hereda los `add_header` del nivel padre cuando el
# nivel hijo define los suyos).
#
# Diferencias con Market (nginx/security-headers.conf):
# - Sin 'wasm-unsafe-eval' en script-src: Rest no usa sql.js/WASM.
# - 'font-src https://fonts.gstatic.com' + 'style-src https://fonts.googleapis.com':
#   style.css importa Barlow de Google Fonts (fallback local a Segoe UI si
#   el CSP bloqueara la red, pero así carga la fuente real).
# - 'connect-src' solo 'self': el cliente llama a /api/ en relativo (mismo
#   origen, nginx lo proxya). En Tauri/APK usa VITE_API_BASE_URL absoluta,
#   si se compila contra otro dominio agrégalo aquí.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; frame-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Permissions-Policy "usb=(), bluetooth=(), camera=(), geolocation=()" always;
