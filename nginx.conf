server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # ==========================================================================
  # Headers de seguridad (Rest Client — adaptado de TekLive.Market)
  #
  # Se declaran a nivel de `server {}` para que se apliquen a TODAS las
  # respuestas. OJO: nginx NO hereda los `add_header` del `server` hacia un
  # `location` que tenga sus propios `add_header` (solo se heredan si el
  # `location` no define ninguno). Por eso los `location` que sí declaran
  # `add_header Cache-Control` vuelven a incluir el snippet de seguridad.
  # ==========================================================================
  include /etc/nginx/security-headers.conf;

  # SPA fallback (vue-router history mode)
  location / {
    try_files $uri $uri/ /index.html;
  }

  # HTML + manifiesto: siempre frescos (si no, el teléfono muestra lo viejo).
  # NOTA: Rest NO tiene service worker (la instalabilidad PWA viene del
  # manifest con iconos), así que no hay sw.js/workbox aquí.
  location ~* ^/(index\.html|manifest\.webmanifest)$ {
    add_header Cache-Control "no-cache, must-revalidate" always;
    # Re-include: este location define add_header, así que NO hereda los
    # headers de seguridad del server (sin esto, index.html se serviría SIN CSP).
    include /etc/nginx/security-headers.conf;
    try_files $uri /index.html;
  }

  # Assets con hash: cache agresivo (el nombre cambia en cada build)
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    # Re-include por la misma razón que arriba.
    include /etc/nginx/security-headers.conf;
  }

  # Mismo origen -> sin CORS: el frontend llama a /api/ en relativo
  # y nginx lo proxya al API .NET.
  # proxy_read_timeout 300s: el login hace bcrypt (puede tardar) y el
  # arqueo de caja hace recálculos transaccionales server-side.
  location /api/ {
    proxy_pass http://${API_UPSTREAM}/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Propagar la IP real del cliente para que el rate limiting del API
    # sea por-cliente y no un bucket global compartido tras los proxies.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
  }
}
